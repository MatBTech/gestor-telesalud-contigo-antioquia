<div class="pagina">
  <div class="encabezado-pagina">
    <div>
      <h1>Usuarios</h1>
      <p>Personas con acceso al sistema</p>
    </div>
    <button mat-flat-button (click)="abrirDialogo()">
      <mat-icon>person_add</mat-icon> Nuevo usuario
    </button>
  </div>

  <div class="tarjeta" style="padding: 0">
    @if (cargando()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <div class="tabla-contenedor">
      <table mat-table [dataSource]="usuarios()">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let u">
            <strong>{{ u.nombreCompleto }}</strong>
            @if (u.id === idActual) {
              <span class="etiqueta etiqueta-amarilla" style="margin-left: 6px">Usted</span>
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="correo">
          <th mat-header-cell *matHeaderCellDef>Correo</th>
          <td mat-cell *matCellDef="let u">{{ u.correo }}</td>
        </ng-container>

        <ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let u"><span class="etiqueta etiqueta-verde">{{ etiquetaRol(u.rol.nombre) }}</span></td>
        </ng-container>

        <!-- El administrador no puede desactivarse a si mismo (el backend tambien lo impide) -->
        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let u">
            <mat-slide-toggle
              [checked]="u.activo"
              [disabled]="u.id === idActual"
              (change)="cambiarActivo(u, $event)"
              [matTooltip]="u.id === idActual ? 'No puede desactivar su propio usuario' : ''"
              [attr.aria-label]="'Usuario activo: ' + u.nombreCompleto"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let u">
            <button mat-icon-button (click)="abrirDialogo(u)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let fila; columns: columnas" [style.opacity]="fila.activo ? 1 : 0.55"></tr>
        <tr class="mat-row fila-vacia" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="columnas.length">
            @if (!cargando()) { No hay usuarios registrados. }
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>
